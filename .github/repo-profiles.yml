# Purpose: Define reusable Copilot configuration profiles for different repository types.
# Notes:
# - Keep this file generic so it can be copied to unrelated teams.
# - Profiles are advisory and can be consumed by automation later.
# - Cross-cutting workflow skills (brainstorming, TDD, debugging, verification, etc.)
#   are included in every profile via the _common_skills anchor.

version: 1

_common_skills: &common_skills
  - skills/superpowers-brainstorming/SKILL.md
  - skills/internal-review-code/SKILL.md
  - skills/superpowers-dispatching-parallel-agents/SKILL.md
  - skills/superpowers-executing-plans/SKILL.md
  - skills/superpowers-finishing-a-development-branch/SKILL.md
  - skills/superpowers-receiving-code-review/SKILL.md
  - skills/superpowers-requesting-code-review/SKILL.md
  - skills/superpowers-subagent-driven-development/SKILL.md
  - skills/superpowers-systematic-debugging/SKILL.md
  - skills/superpowers-test-driven-development/SKILL.md
  - skills/superpowers-using-git-worktrees/SKILL.md
  - skills/superpowers-using-superpowers/SKILL.md
  - skills/superpowers-verification-before-completion/SKILL.md
  - skills/superpowers-writing-plans/SKILL.md

profiles:
  minimal:
    description: Baseline setup for small repositories.
    recommended_skills:
      - skills/internal-markdown/SKILL.md
      - skills/internal-yaml/SKILL.md
      - skills/internal-json/SKILL.md
      - skills/internal-github-actions/SKILL.md

  backend-java:
    description: Java service repositories.
    recommended_skills:
      - skills/internal-java/SKILL.md
      - skills/internal-java-project/SKILL.md
      - skills/internal-github-actions/SKILL.md
      - skills/internal-markdown/SKILL.md

  backend-nodejs:
    description: Node.js service repositories.
    recommended_skills:
      - skills/internal-nodejs/SKILL.md
      - skills/internal-nodejs-project/SKILL.md
      - skills/internal-github-actions/SKILL.md
      - skills/internal-markdown/SKILL.md

  backend-python:
    description: Python service repositories.
    recommended_skills:
      - skills/internal-python/SKILL.md
      - skills/internal-python-project/SKILL.md
      - skills/internal-github-actions/SKILL.md
      - skills/internal-markdown/SKILL.md

  document-heavy:
    description: Repositories that regularly create or edit office documents and slide decks.
    recommended_skills:
      - skills/internal-markdown/SKILL.md
      - skills/internal-yaml/SKILL.md
      - skills/anthropic-docx/SKILL.md
      - skills/openai-pdf/SKILL.md
      - skills/anthropic-pptx/SKILL.md
      - skills/anthropic-xlsx/SKILL.md

  infrastructure-heavy:
    description: Infrastructure repositories with Terraform as primary language.
    recommended_skills:
      - skills/internal-terraform/SKILL.md
      - skills/internal-github-actions/SKILL.md
      - skills/internal-yaml/SKILL.md
      - skills/internal-cloud-policy/SKILL.md

  azure-platform:
    description: Azure platform, landing-zone, or governance repositories that need cost-aware guidance.
    recommended_skills:
      - skills/internal-terraform/SKILL.md
      - skills/internal-yaml/SKILL.md
      - skills/internal-markdown/SKILL.md
      - skills/internal-azure/SKILL.md
      - skills/internal-azure-organization-structure/SKILL.md
      - skills/internal-azure-governance/SKILL.md
      - skills/internal-azure-operations/SKILL.md
      - skills/awesome-copilot-azure-pricing/SKILL.md

  mixed-platform:
    description: Repositories mixing app code, CI/CD, and some infrastructure.
    recommended_skills:
      - skills/internal-java/SKILL.md
      - skills/internal-java-project/SKILL.md
      - skills/internal-nodejs/SKILL.md
      - skills/internal-nodejs-project/SKILL.md
      - skills/internal-github-actions/SKILL.md
      - skills/internal-terraform/SKILL.md
