interface:
  display_name: "internal-gateway-execute-plans"
  short_description: "Approved retained-plan execution"
  default_prompt: >-
    Use /internal-gateway-execute-plans only after explicit approval of the
    exact retained plan path and actual task target from the writer. Verify the
    approved criteria, dependencies, verification, human checkpoints, source
    coherence, and writable scope before invoking /mattpocock-implement.
    Preserve user work and stop on unresolved references, conflicts, material
    changes, or out-of-scope writes. Never commit, create branches or
    worktrees, infer tasks from a spec, or start automatically from readiness.
    A plan with a legacy Execution Manifest and all historical run files remain
    read-only; never auto-resume or migrate them. Ordinary current-task resume
    still requires current approval and source coherence, and never uses a
    custom old runtime. Report plan, task, changed paths, checks, checkpoints,
    and residual approval gaps.
