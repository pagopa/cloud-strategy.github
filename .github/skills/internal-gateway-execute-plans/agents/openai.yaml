interface:
  display_name: "Internal Gateway Execute Plans"
  short_description: "Gateway for retained-plan execution"
  default_prompt: "Use $internal-gateway-execute-plans for approved retained-plan execution or resume under tmp/superpowers/. Wrap, then delegate the execution loop to superpowers-executing-plans. Keep superpowers-executing-plans read-only. Before final response or pause, replace any older sibling <plan-basename>.*.md status file for the same plan basename, then write exactly one sibling status file named <plan-basename>.<STATUS>.md using DONE, BLOCKED, PARTIAL, or NEEDS_REVIEW."
