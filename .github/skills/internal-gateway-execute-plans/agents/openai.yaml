interface:
  display_name: "Internal Gateway Execute Plans"
  short_description: "Repo wrapper for current-only retained plan execution"
  default_prompt: "Use $internal-gateway-execute-plans to classify retained plan folders from 01-change-summary.md and 02-source-item-ledger.md, then infer the best execution strategy from plan profile, folder shape, implementation-contract presence when applicable, and validation path. Reject unsupported profiles. This wrapper executes approved compact mini-plan-* plans and approved extended plans, and enforces shared closeout validation contracts. Do not require a Recommended consumer field in the retained plan. Create done-* markers only for DONE final packaging. For non-DONE exits, keep the plan live and report State, Continuation, and a visible next-step package. Use the bundle-local CLI for deterministic inspect, resume, checkpoint, and completion-check."
