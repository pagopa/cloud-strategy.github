interface:
  display_name: "Internal Gateway Execute Plans"
  short_description: "Repo wrapper for current-only done-file plan execution"
  default_prompt: "Use $internal-gateway-execute-plans to classify retained plan folders from 01-change-summary.md and 02-source-item-ledger.md, then apply numbered plans with the ledger as live state. Reject unsupported profiles. Compact execution belongs to internal-gateway-simple-task; this wrapper executes approved extended plans and enforces shared closeout validation contracts. Create done-* markers only for SHIPPED final packaging. For non-SHIPPED exits, keep the plan live and report State, Continuation, and a visible next-step package. Use the bundle-local CLI for deterministic inspect, resume, checkpoint, and completion-check."
