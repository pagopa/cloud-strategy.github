interface:
  display_name: "Internal Gateway Execute Plans"
  short_description: "Repository gateway for approved retained-plan execution"
  default_prompt: "Use /internal-gateway-execute-plans for approved retained-plan execution or resume under tmp/superpowers/plans/. Load /superpowers-executing-plans for critical plan review, todos, task execution, and core stop behavior. At the local gates load /internal-tdd for executable-behavior test-first work, /superpowers-verification-before-completion before final evidence, and /addyosmani-code-simplification only when the approved task authorizes simplification. Bind the exact plan path, compute the plan fingerprint with SHA-256, and treat location, readability, actionability, status binding, fingerprint, completion state, approval, and runtime safety as the mechanical or gateway safety boundary. Treat missing descriptive headings and legacy execution metadata as notices with defaults. Require the minimal resumable status core; validate optional baseline, recovery, classification, and resume evidence when present. Check workspace overlap, capture broad validation before edits, preserve the baseline/final delta, classify failures, and attempt bounded recovery while evidence improves. Continue independent work after proven pre-existing or unrelated failures; stop on fatal conditions or unresolved task-local regression. Preserve local routing and status rules, require fresh task-level evidence, write exactly one allowed status sibling before pause or closeout, give a concise user-facing report that does not require opening the status file, and enforce no Git mutation throughout."
