interface:
  display_name: "Internal Gateway Execute Plans"
  short_description: "Repo wrapper around superpowers-executing-plans with required status artifact"
  default_prompt: "Use $internal-gateway-execute-plans for approved retained-plan execution under tmp/superpowers/. This gateway activates before superpowers-executing-plans, keeps execution inside repo-local target and anti-scope, and requires exactly one sibling status file named <plan-basename>.<STATUS>.md before final response or pause. Supported statuses are DONE, BLOCKED, PARTIAL, and NEEDS_REVIEW. Do not modify superpowers-executing-plans. Do not create new <STATE>-plan-state.md, done-* packaging, completion-report.md, or evidence-envelope.md artifacts as this gateway's closeout."
