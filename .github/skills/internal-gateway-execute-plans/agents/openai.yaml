interface:
  display_name: "internal-gateway-execute-plans"
  short_description: "Approved retained-plan execution"
  default_prompt: >-
    Use /internal-gateway-execute-plans to execute, resume, or query an
    approved plan under tmp/superpowers/plans/. Run Native through
    /superpowers-executing-plans in the current checkout, without commits,
    branches, worktrees, or imported helper scripts. Load the run protocol and
    chat templates. Before publishing a ledger or editing tasks, validate
    legacy and prose dependencies, rerun Depends on checks, resolve branch
    and dirty-file consent, prove new Git object access, and create a readable
    CP0 tree. Record approvals, derived status, checkpoints, task validations,
    repair attempts, stop codes, and final review in the ledger. On resume,
    verify approval and all checkpoint objects; never reset or overwrite state.
    Apply scoped checkout classification: disclose Foreign state outside output
    diffs, require content-bound inclusion or verified upstream attribution,
    and reconcile relevant run conflicts. Adopt only unrelated same-branch
    descendant commits; no whole-tree equality or global exclusivity gate.
    Run status queries read-only. Use native-only execution even when another
    method is requested. Report localized chat status in at most five lines
    with one final bold action.
