interface:
  display_name: "internal-gateway-execute-plans"
  short_description: "Approved retained-plan execution"
  default_prompt: >-
    Use /internal-gateway-execute-plans to run one approved plan under
    tmp/superpowers/plans/ through /superpowers-executing-plans by default or
    /superpowers-subagent-driven-development when chosen. Work in the current
    checkout without branches, worktrees, or commits; record START and the
    initial status in the ledger; honor each task posture; stop when HEAD
    moves, the Files: perimeter or a protected skill would be crossed, or a
    task file was already dirty. Review git diff START, keep the ledger, and
    report Plan, Changed, Checks, and Next with the rulings list.
