interface:
  display_name: "internal-gateway-execute-plans"
  short_description: "Approved retained-plan execution"
  default_prompt: >-
    Use /internal-gateway-execute-plans to run one approved plan under
    tmp/superpowers/plans/ through /superpowers-executing-plans for Native or
    Inline, or /superpowers-subagent-driven-development for Subagent-driven.
    Work in the current checkout without branches, worktrees, or commits.
    Record START, the initial status, and checkpoint trees CP0..CPn in the
    ledger; on resume reuse them and stop for reconciliation on any mismatch
    outside the first incomplete task. Review with checkpoint diffs, honor each
    task posture, and stop when HEAD moves, the Files: perimeter or a protected
    skill would be crossed, or a task file was already dirty. Run the final
    review from CP0, keep the ledger, and report Plan, Changed, Checks, and
    Next with the rulings list.
