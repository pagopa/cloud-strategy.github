interface:
  display_name: "Execute Plans Internal Gateway"
  short_description: "Repository gateway for approved retained-plan execution"
  default_prompt: "Use /internal-gateway-execute-plans for approved retained-plan execution or resume under tmp/superpowers/plans/. Bind the writer-owned versioned Execution Contract, preserve native validation commands, and record all six executor-owned discovery categories and structured recovery evidence. Continue through safe recovery; request authority while execution remains active. Use closeout-check with both plan and evidence paths as the deterministic route owner. Write one matching status sibling only for DONE, PARTIAL, BLOCKED, or NEEDS_REVIEW, and never mutate Git."
