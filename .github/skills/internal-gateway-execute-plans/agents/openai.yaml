  short_description: "Self-contained gateway for approved retained-plan execution"
  default_prompt: "Use $internal-gateway-execute-plans for approved retained-plan execution or resume under tmp/superpowers/plans/. The skill is self-contained: it owns the full nine-phase workflow, status transition, and validation. Bind the plan with an exact path, compute a plan fingerprint via the bundle CLI, check workspace overlap, require red-first evidence or a pre-code seam exception, demand fresh task-level evidence before every transition, write exactly one allowed status sibling before pause or closeout, and enforce no Git mutation throughout."
