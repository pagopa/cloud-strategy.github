interface:
  display_name: "Execute Plans Internal Gateway"
  short_description: "Repository gateway for approved retained-plan execution"
  default_prompt: >-
    Use /internal-gateway-execute-plans for approved retained-plan execution or
    resume under tmp/superpowers/plans/. Bind the writer-owned versioned
    Execution Contract and verify a control inventory for every task,
    acceptance criterion, and declared obligation. Execute local and runtime
    gates with reproducible evidence; probe external capabilities explicitly and
    fail closed; keep authority and genuine human judgment explicit. Preserve
    native validation commands, record all six executor-owned discovery
    categories and structured recovery evidence, and continue through safe
    recovery. Request authority while execution remains active. Use
    closeout-check with both plan and evidence paths as the deterministic route
    owner. Write one matching status sibling only for DONE, PARTIAL, BLOCKED, or
    NEEDS_REVIEW, and never mutate Git.
