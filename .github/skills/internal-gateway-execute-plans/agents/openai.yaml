interface:
  display_name: "internal-gateway-execute-plans"
  short_description: "Approved retained-plan execution"
  default_prompt: >-
    Use $internal-gateway-execute-plans to execute the identified retained
    plan; the user's execution request approves its declared tasks. Hand them to
    /mattpocock-implement under the gateway's no-commit, single-final-review
    contract. Locate and read the available implementer without another mention;
    report genuine missing capability and actual check results.
policy:
  allow_implicit_invocation: true
