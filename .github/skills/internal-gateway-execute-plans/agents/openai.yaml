interface:
  display_name: "Execute Plans Internal Gateway"
  short_description: "Repository gateway for approved retained-plan execution"
  default_prompt: >-
    Use /internal-gateway-execute-plans for approved retained-plan execution or
    resume under tmp/superpowers/plans/. Bind the writer-owned versioned
    Execution Contract and verify a control inventory for every task,
    acceptance criterion, and declared obligation. Execute local and runtime
    gates with reproducible evidence; probe external capabilities explicitly and
    fail closed for the capability decision; distinguish unavailable evidence
    from a material failure; retry safe repairs while evidence improves; keep
    authority and human or external follow-up explicit without blocking DONE
    when no material failure was observed. Preserve
    native validation commands, record all six executor-owned discovery
    categories and structured recovery evidence, and continue through safe
    recovery. Request authority while execution remains active. Use
    /internal-tdd to record and apply the selected posture at executable task
    boundaries; require red-first evidence only for mandatory-test-first, and
    require reachable focused and broad validation before feature-first
    production-ready completion. Use
    closeout-check with both plan and evidence paths as the deterministic route
    owner. Write one matching status sibling only for DONE, PARTIAL, BLOCKED, or
    NEEDS_REVIEW, and never mutate Git. The local gateway owns routing,
    recovery, stopping, worktree/finishing decisions, status, and closeout;
    delegate only critical review, todo tracking, and task mechanics to
    imported execution core. Before any plan-writing or execution delegation,
    probe gpt-5.6-luna at max reasoning. If unavailable, select the least
    expensive suitable available fallback and record timestamp/context,
    availability, selected model, reasoning, suitability evidence, and
    cost/fallback rationale. The known drafting fallback is gpt-5.6-terra/high,
    not a guarantee; Luna absence alone is not a blocker when fallback evidence
    is complete.
