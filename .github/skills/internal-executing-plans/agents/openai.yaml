  short_description: "Repo wrapper for done-file plan execution"
  default_prompt: "Use $internal-executing-plans to classify retained plan folders from 01-change-summary.md and 02-source-item-ledger.md, then apply numbered plans with the ledger as live state. Create done-* markers only for `SHIPPED` final packaging. For non-`SHIPPED` exits, keep the plan live and report `State`, `Continuation`, and a visible next-step package."
