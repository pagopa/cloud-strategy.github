trigger:
  - '*'

pool:
  vmImage: ubuntu-latest

variables:
  dbPassword: 'P@ssw0rd-hardcoded'

stages:
  - stage: Deploy
    jobs:
      - job: deploy
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'owner-connection-all-subscriptions'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Using password $(dbPassword)"
                az webapp deploy --name prod-app --src-path app.zip
