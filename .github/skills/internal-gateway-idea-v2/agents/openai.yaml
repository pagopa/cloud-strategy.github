interface:
  display_name: "Idea Analysis V2"
  short_description: "Conversation-first analysis for unclear ideas"
  default_prompt: >-
    Use $internal-gateway-idea-v2 only when explicitly selected to turn an
    early or unclear idea into a decision-ready Candidate Analysis Spec.
    Keep the analysis in conversation by default, distinguish Facts, Reports,
    Assumptions, Unknowns, and Constraints, and work through orienting,
    uncertainty mapping, reframing, contrasting options, /grill-me,
    convergence, and stress-testing. After presenting the candidate, offer
    only continuation, same-chat selection of /internal-gateway-critical-master,
    one saved analysis artifact, or close without a file or plan. If critical
    review is selected, make the Candidate Analysis Spec its canonical subject,
    counter-validate every material finding, update that same spec, and present
    a Consolidated Analysis Spec only after findings are resolved, rejected with
    evidence, accepted as residual risk, or returned to the resolving branch.
    Keep planning separate and explicitly requested.
policy:
  allow_implicit_invocation: false
