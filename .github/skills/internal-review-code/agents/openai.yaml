  short_description: "Repository wrapper for the imported code-review engine"
  default_prompt: "Use /internal-review-code as the repository wrapper and /addyosmani-code-review-and-quality as the sole review engine; for workflow or composite-action targets invoke /internal-github with the minimal role/parent/deliverable/evidence envelope so it selects the relevant contributor, and use the same gateway for separate non-review GitHub follow-ups; keep contributors bounded to observations and evidence, with parent exclusion owned by the gateway; complete the review preflight, resolve target and source provenance, derive adversarial probes, run the ordered review sequence, return the report-only projection with one user action, use exactly MERGE READY, CHANGES REQUIRED, or REVIEW BLOCKED for the one public verdict, and stop with REVIEW BLOCKED when target, engine identity, or resolved source is unavailable."
