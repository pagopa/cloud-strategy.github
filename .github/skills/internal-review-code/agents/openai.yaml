interface:
  display_name: "internal-review-code"
  short_description: "Repository wrapper for the imported code-review engine"
  default_prompt: "Use /internal-review-code for a report-only review of a branch, pull request, diff, or read-only code target, with /addyosmani-code-review-and-quality as the sole review engine; route workflow or composite-action targets through /internal-github; open with the emoji fields 🔎 verdict, 📌 reason, 🧪 evidence, 👉 next action, then emoji-marked severity sections; return exactly one verdict: MERGE READY, CHANGES REQUIRED, or REVIEW BLOCKED when the target, engine identity, or resolved source is unavailable."
