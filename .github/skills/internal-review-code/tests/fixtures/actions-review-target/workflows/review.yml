name: Actions review target

on:
  pull_request:
    paths:
      - "actions/publish/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish review artifact
        id: publish
        uses: ./actions/publish
        with:
          artifact-name: ${{ github.event.pull_request.head.sha }}
