interface:
  display_name: "Idea Internal Gateway"
  short_description: "Idea shaping with outcome proofs and final approval"
  default_prompt: |-
    Use /internal-gateway-idea for repository-owned idea shaping or review before
    planning. Load /superpowers-brainstorming, persist only
    tmp/idea/<slug>/design.md using references/design-template.md, and follow
    the compact SCOPE -> DISCOVER -> QUESTION? -> ANALYZE -> CRITIQUE ->
    USER_DECISION -> REVISE -> VERIFY -> FINAL_APPROVAL -> HANDOFF/STOP flow.

    Use the strict state helper and the critical-master full-analysis packet at
    their documented boundaries. Reconstruct a draft and clear claimed review
    or approval when state is stale, missing, or corrupt; never append a
    transcript or create state.yaml.

    Keep coverage, minimality, controlling platform evidence, assurance, and
    current-revision approval explicit. Add interface, independent-decision,
    and consumer columns when ownership or runtime surfaces expand.

    Recompose the complete design before critique. A material change starts a
    new revision and invalidates review and approval. Use one standard packet
    and one independent packet when assurance is high; invalid or unavailable
    required review fails closed. Only current approval may load
    /internal-gateway-writing-plans, and neither design nor plan approval
    authorizes implementation. Use one compact decision card for status, risk,
    validation, and next action; content-bearing questions, designs, and
    critique packets keep their schemas.
