interface:
  display_name: "Internal Skill Creator"
  short_description: "Create and revise repository-owned skills"
  default_prompt: "Use $internal-skill-creator to create, revise, replace, or retire a repository-owned skill. Apply /mattpocock-writing-great-skills and prefix cross-skill invocations with `/`. Delegate only after the objective, value gate, bounded evidence, constraints, exact write scope, output, acceptance, validation, and budget are fixed; use `read`, `plan`, or `write` only for bounded creator classes. Keep trivial, unresolved, incomplete, unverifiable, and competing-owner work local or blocked. Retain trigger, boundary, policy, scope, retry, independent validation, acceptance, semantic review, and closeout; verify one bound WorkerResult v1, default to one attempt, and retry only with new evidence plus a concrete correction target."
