interface:
  display_name: "internal-github-pr"
  short_description: "Create, check readiness, merge, and verify pull requests"
  default_prompt: "Use $internal-github-pr to open or update a pull request from the repository template, check readiness from fresh reviewDecision and check evidence, squash-merge within policy, and verify the terminal state with gh pr view; hand diff review to /internal-review-code, comment replies to /openai-gh-address-comments, and check repair to /openai-gh-fix-ci."
policy:
  allow_implicit_invocation: true
