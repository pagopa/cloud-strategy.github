interface:
  display_name: "internal-subagent-contract"
  short_description: "Write, execute, and check one bounded subagent handoff"
  default_prompt: >-
    Use $internal-subagent-contract for one bounded brief/result handoff.
    Act in the role you hold. As caller, pass the value gate, write a
    DelegationBrief with mode read, write, or plan, and run the brief
    validator before any worker runs; when the gate fails, do the work locally
    without a brief. As worker, stay inside write_scope, invoke no other
    agent, and return exactly the ten semantic JSON fields without
    brief_sha256, progress_signature, or budgets_used, choosing the status
    from the status table. As consumer, compose the WorkerResult and
    VerificationReceipt with the adapter, verify bytes and evidence yourself,
    and record the caller decision separately. When no worker payload exists,
    record a LifecycleRecord and create no WorkerResult or receipt. The
    protocol itself never routes, retries, or selects a provider or model.
