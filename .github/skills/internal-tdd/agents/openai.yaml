interface:
  display_name: "Internal TDD"
  short_description: "Risk-driven TDD routing for code changes"
  default_prompt: "Use $internal-tdd for coding changes with executable or evaluable behavior; classify the risk and delivery stage, select the closest native boundary, and delegate only mandatory-test-first work to /superpowers-test-driven-development. For feature-first work require reachable focused and broader validation before production-ready completion; for prototype-unverified or validation-only work report the evidence gap. After the parent locks the posture, boundary, artifact shape, write scope, and validation, use /internal-low-cost-delegation only for an exactly specified RED artifact, bounded log analysis, or one mechanical GREEN slice; retain posture choice, refactor, and final verification here."
