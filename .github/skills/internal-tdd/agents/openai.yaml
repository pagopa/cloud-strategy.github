interface:
  display_name: "internal-tdd"
  short_description: "Risk-driven TDD routing for code changes"
  default_prompt: "Use $internal-tdd for coding changes with executable or evaluable behavior; classify the risk and delivery stage, select the closest native boundary, and delegate only mandatory-test-first work to /superpowers-test-driven-development. For feature-first work require reachable focused and broader validation before production-ready completion; for prototype-unverified or validation-only work report the evidence gap. After the parent locks the posture, boundary, artifact shape, write scope, acceptance, and validation, you may invoke internal-luna-executor through /internal-subagent-contract with one DelegationBrief v1; retain posture choice, routing, authority, lifecycle, retry choice, independent validation, refactor, and final verification here, verify the adapter-composed WorkerResult v1 plus caller-owned VerificationReceipt v1, and record a caller-owned LifecycleRecord without fabricating either when timeout, interruption, executor unavailability, or missing terminal output prevents a worker payload."
