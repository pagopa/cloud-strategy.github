interface:
  display_name: "Internal TDD"
  short_description: "Risk-driven TDD routing for code changes"
  default_prompt: "Use $internal-tdd for coding changes with executable or evaluable behavior; classify the seam, then delegate mandatory red-green-refactor work to /superpowers-test-driven-development. After the parent locks the seam, red proof, artifact shape, write scope, and validation, use /internal-low-cost-delegation only for an exactly specified RED artifact, bounded log analysis, or one mechanical GREEN slice; retain seam choice, red proof, refactor, and final verification here."
