AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Defective thumbnail pipeline that writes output to its own trigger prefix.

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket

  ThumbnailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.13
      Handler: app.handler
      Environment:
        Variables:
          OUTPUT_BUCKET: !Ref MediaBucket
          OUTPUT_PREFIX: uploads/
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
      Events:
        Upload:
          Type: S3
          Properties:
            Bucket: !Ref MediaBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
