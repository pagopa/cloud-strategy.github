    reason: Go guidance was extracted into a repository-owned skill-first owner.
  - source_family: github/awesome-copilot
    upstream_id: kubernetes_manifests.instructions.md
    local_owner: internal-kubernetes
    reason: Kubernetes manifest guidance was extracted into repository-owned Kubernetes skills.
  - source_family: github/awesome-copilot
    upstream_id: shell.instructions.md
    local_owner: internal-bash
    reason: Shell guidance was extracted into the repository-owned Bash baseline and script skill split.
  - source_family: mattpocock/skills
    upstream_id: diagnose
    local_owner: internal-debugging
    reason: Root-cause diagnosis loop was extracted into a repository-owned owner.
  - source_family: mattpocock/skills
    upstream_id: tdd
    local_owner: internal-tdd
    reason: Test-first delivery rules were extracted into a repository-owned owner.
  - source_family: mattpocock/skills
    upstream_id: improve-codebase-architecture
    local_owner: internal-review-high-level
    reason: Architecture deepening lenses were extracted into high-level review.
  - source_family: mattpocock/skills
    upstream_id: zoom-out
    local_owner: internal-review-high-level
    reason: Codebase orientation, module maps, caller maps, and domain vocabulary were extracted into high-level review.
  - source_family: mattpocock/skills
    upstream_id: grill-with-docs
    local_owner: internal-gateway-writing-plans
    reason: Glossary and ADR side effects are not default repository conventions.
  - source_family: mattpocock/skills
    upstream_id: setup-matt-pocock-skills
    local_owner: local-agent-sync-external-resources
    reason: Setup conventions are not part of the managed source catalog.
  - source_family: mattpocock/skills
    upstream_id: caveman
    local_owner: retired
    reason: The previously retained caveman import was retired from the managed catalog by explicit user scope reduction. Do not reimport unless the user re-approves the retained import.
  - source_family: mattpocock/skills
    upstream_id: code-review
    local_owner: retired
    reason: The mattpocock-code-review import was replaced by addyosmani-code-review-and-quality from addyosmani/agent-skills. Do not reimport unless the user re-approves the retained import.
  - source_family: addyosmani/agent-skills
    upstream_id: idea-refine
    local_owner: internal-gateway-idea
    reason: Useful shaping frameworks and evaluation criteria were extracted into the repository-owned idea gateway; the competing autonomous workflow was retired.
