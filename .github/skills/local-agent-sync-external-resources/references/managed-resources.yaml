watchlist:
  - source_family: github/awesome-copilot
    upstream_id: azure-devops-pipelines.instructions.md
    local_owner: internal-azure-devops
    reason: Azure DevOps pipeline guidance was extracted into a repository-owned skill-first owner.
  - source_family: github/awesome-copilot
