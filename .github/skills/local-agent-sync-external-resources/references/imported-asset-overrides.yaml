version: 1
policy:
  default_rule: keep imported upstream assets verbatim
  exception_rule: Allow a direct imported-asset override only for a strong repo-specific
    need that the user explicitly counter-validates, then register the replay patch
    in this bundle before treating the override as active.
  replay_rule: Prefer a clean patch replay first, then allow a registered `git apply
    --3way` fallback when upstream text drift is compatible. Stop for review if neither
    path applies cleanly.
overrides:
- id: grill-me-bulk-recommended-questions
  target_path: .github/skills/grill-me/SKILL.md
  source_family: mattpocock/skills
  lifecycle_mode: post-refresh-patch
  apply_strategy: git-apply-3way
  approval: explicit-user-counter-validated
  reason: Default the initial grilling pass to a dependency-ordered numbered question
    set with clear recommendations that the user can accept by default, while preserving
    follow-up pressure on contradictions, risks, and unresolved decisions; keep operational
    gate semantics in internal-gateway-review.
  patch_path: patches/grill-me.patch
  expected_content_hash: 4965b2f80bed21a005e0baa241e8e9e0d502c276cdf83c394cb3feac1d4dc71b
  baseline_repo_commit: efa058a
  validation_note: Stop the refresh if the patch does not apply cleanly; review whether
    an internal wrapper should replace the override.
