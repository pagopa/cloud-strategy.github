# Defective fixture: a PR edits this pull_request_target workflow and expects its own run to change.
# PR description: "Fixed the label step; re-running checks on this PR should now pass."
name: label-pr
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          sync-labels: true
