policy:
  allow_implicit_invocation: true
interface:
  display_name: "internal-github"
  short_description: "Official GitHub entry point and router"
  default_prompt: "Use /internal-github as the entry point for this GitHub request; classify the primary deliverable, route workflow, reusable-workflow, and composite-action work to /internal-github-actions, route technical diff review to /internal-review-code, route PR readiness and lifecycle to /internal-github-pr, and invoke only the minimum ordered specialist set."
