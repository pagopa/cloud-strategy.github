<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<style>
:root {
  color-scheme: light;
  --ink: #1f2933;
  --ink-soft: #334155;
  --muted: #64748b;
  --line: #e6ebe8;
  --line-strong: #d2dbd6;
  --surface: #ffffff;
  --soft: #f5f8f6;
  --paper: #eef5f1;
  --warm: #f7f3ee;
  --accent: #0f766e;
  --accent-mid: #0d9488;
  --accent-soft: #d9f3ee;
  --accent-deep: #115e59;
  --accent-wash: rgba(15, 118, 110, .08);
  --warm-accent: #b8895a;
  --warm-soft: #f4ebe1;
  --warning: #b45309;
  --warning-soft: #fff1df;
  --critical: #b42318;
  --critical-soft: #fdecea;
  --shadow: 0 1px 2px rgba(31, 41, 51, .04), 0 14px 34px rgba(31, 41, 51, .05);
  --radius: .95rem;
  --max: 960px;
  --pad: 1.25rem;
  --sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% -4%, rgba(13, 148, 136, .10), transparent 26rem),
    radial-gradient(circle at 96% 4%, rgba(184, 137, 90, .07), transparent 22rem),
    linear-gradient(180deg, #f7faf8 0%, var(--soft) 46%, #f3f1ec 100%);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Typography */
h1, h2, h3, h4, .metric-value, .finding-id {
  font-family: var(--serif);
  letter-spacing: -.015em;
  line-height: 1.2;
  font-weight: 700;
  color: var(--ink);
}
h1 {
  margin: .3rem 0 .55rem;
  font-size: clamp(1.65rem, 2.3vw, 2.15rem);
}
h2 {
  position: relative;
  display: flex;
  align-items: center;
  gap: .7rem;
  margin: 2.75rem 0 1rem;
  padding: .15rem 0 .75rem .95rem;
  border-bottom: 1px solid var(--line-strong);
  font-size: 1.38rem;
}
h2::before {
  content: "";
  position: absolute;
  left: 0;
  top: .15rem;
  bottom: .75rem;
  width: .28rem;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--accent-deep) 0%, var(--accent-mid) 55%, #5eead4 100%);
}
h3 {
  position: relative;
  margin: 1.55rem 0 .7rem;
  padding: .1rem 0 .1rem .8rem;
  font-size: 1.05rem;
  color: var(--ink-soft);
}
h3::before {
  content: "";
  position: absolute;
  left: 0;
  top: .25rem;
  bottom: .25rem;
  width: .16rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 42%, var(--line-strong));
}
.card > h3,
.decision-group > h3,
.finding-block > h4,
.copy-request > h4 {
  margin-top: 0;
  padding-left: 0;
  color: var(--ink);
}
.card > h3::before,
.decision-group > h3::before {
  display: none;
}
h4 {
  margin: 0 0 .35rem;
  font-size: .98rem;
  color: var(--ink-soft);
}
p { margin: 0 0 .75rem; }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 0; padding-left: 1.2rem; }
li + li { margin-top: .35rem; }
a {
  color: var(--accent-deep);
  text-decoration-thickness: .07em;
  text-underline-offset: .16em;
}
a:hover { color: var(--accent-mid); }
a:focus-visible,
summary:focus-visible,
button:focus-visible {
  outline: 3px solid #f59e0b;
  outline-offset: 3px;
}

/* Shell */
.header-inner,
.page {
  max-width: var(--max);
  margin: 0 auto;
  padding-inline: var(--pad);
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(15, 118, 110, .10);
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(12px);
}
.header-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem 1.25rem;
  padding-block: 1rem 1.05rem;
}
.eyebrow {
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--accent-deep) 55%, var(--muted));
}
nav {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem;
  padding: .2rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, .88);
}
nav a {
  color: var(--muted);
  text-decoration: none;
  padding: .42rem .78rem;
  border-radius: 999px;
  font-size: .88rem;
  font-weight: 650;
  transition: background .15s ease, color .15s ease;
}
nav a:hover {
  background: var(--accent-soft);
  color: var(--accent-deep);
}

.page {
  padding-top: 1.6rem;
  padding-bottom: 4.5rem;
}

/* Lead + metrics */
.lede {
  max-width: 68ch;
  color: var(--muted);
  font-size: 1.04rem;
  line-height: 1.68;
}
.page > .lede {
  max-width: 44rem;
  margin: 0 0 1.35rem;
  padding-bottom: 1.1rem;
  border-bottom: 2px solid color-mix(in srgb, var(--accent) 55%, var(--warm-accent));
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.55;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: .85rem;
  margin: 0 0 1.75rem;
}
.metric {
  position: relative;
  overflow: hidden;
  padding: .95rem 1rem .95rem 1.1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    linear-gradient(180deg, #fff 0%, color-mix(in srgb, var(--accent-soft) 18%, #fff) 100%);
  box-shadow: var(--shadow);
}
.metric::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: .25rem;
  background: linear-gradient(180deg, var(--accent-deep), var(--accent-mid));
}
.metric.warning {
  background: linear-gradient(180deg, #fff 0%, color-mix(in srgb, var(--warning-soft) 55%, #fff) 100%);
}
.metric.critical {
  background: linear-gradient(180deg, #fff 0%, color-mix(in srgb, var(--critical-soft) 55%, #fff) 100%);
}
.metric.warning::before { background: var(--warning); }
.metric.critical::before { background: var(--critical); }
.metric-label {
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
.metric-value {
  margin-top: .3rem;
  font-size: 1.7rem;
  line-height: 1.05;
  color: var(--accent-deep);
}
.metric.warning .metric-value { color: var(--warning); }
.metric.critical .metric-value { color: var(--critical); }
.metric-detail {
  margin-top: .3rem;
  font-size: .82rem;
  color: var(--muted);
  line-height: 1.4;
}

/* Surfaces */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
}
.card,
details,
.decision-group,
.finding-disclosure,
table {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.card {
  padding: 1.05rem 1.1rem 1.15rem;
  background:
    linear-gradient(180deg, #fff 0%, color-mix(in srgb, var(--soft) 70%, #fff) 100%);
}
.card > :first-child { margin-top: 0; }

.section-anchor {
  scroll-margin-top: 5.75rem;
  margin-top: 1.75rem;
  padding: 1.15rem 1.15rem 1.25rem;
  border: 1px solid color-mix(in srgb, var(--accent) 10%, var(--line));
  border-radius: calc(var(--radius) + .15rem);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .84) 0%, rgba(245, 248, 246, .72) 100%);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, .75) inset,
    0 10px 28px rgba(31, 41, 51, .03);
}
.section-anchor:first-of-type { margin-top: .35rem; }
.section-anchor > h2 { margin-top: 0; }
.section-anchor > .lede {
  margin: -.15rem 0 1.1rem;
  font-size: .98rem;
}
.section-anchor > h3 {
  margin-top: 1.35rem;
  padding-top: .15rem;
}

/* Claims / sources */
.claim-text { margin: 0; color: var(--ink-soft); }
.sources {
  margin-top: .8rem;
  padding-top: .5rem;
  border-top: 1px solid var(--line);
  font-size: .9rem;
  box-shadow: none;
}
.sources > summary {
  color: var(--muted);
  font-weight: 700;
}
.source { margin-top: .55rem; }
.source + .source { margin-top: .7rem; }
.source-link { font-weight: 700; }
blockquote {
  margin: .3rem 0 0;
  padding: .5rem .75rem;
  border-left: 3px solid color-mix(in srgb, var(--accent) 70%, var(--warm-accent));
  border-radius: 0 .45rem .45rem 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent-soft) 45%, #fff), var(--warm));
  color: var(--muted);
  white-space: pre-wrap;
  font-size: .94rem;
  line-height: 1.55;
}

/* Lists / timeline */
.timeline {
  display: grid;
  gap: .8rem;
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: step;
}
.timeline li {
  display: grid;
  grid-template-columns: 2.25rem 1fr;
  gap: .75rem;
  align-items: start;
  counter-increment: step;
}
.timeline li::before {
  content: counter(step);
  display: grid;
  place-items: center;
  width: 2.15rem;
  height: 2.15rem;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-deep);
  font-family: var(--sans);
  font-size: .9rem;
  font-weight: 800;
}

/* Decisions */
.decision-board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 18.5rem), 1fr));
  gap: 1rem;
  width: 100%;
}
.decision-board:has(> :only-child) {
  grid-template-columns: minmax(0, 1fr);
}
.decision-group {
  min-width: 0;
  padding: 1rem 1.05rem 1.1rem;
  border-top: .28rem solid var(--accent);
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 42%, #fff), var(--surface));
}
.decision-group[data-decision-state="open"] {
  border-top-color: var(--warning);
  background: linear-gradient(180deg, color-mix(in srgb, var(--warning-soft) 60%, #fff), var(--surface));
}
.decision-group[data-decision-state="not-specified"] {
  border-top-color: #94a3b8;
  background: linear-gradient(180deg, #f8fafc, var(--surface));
}
.decision-group h3 {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: .5rem;
  margin: 0 0 .75rem;
  padding: 0;
}
.decision-group h3::before { display: none; }
.count {
  color: var(--muted);
  font-family: var(--sans);
  font-size: .82rem;
  font-weight: 650;
}
.decision-group ol {
  margin: 0;
  padding-left: 1.1rem;
}
.decision-group li {
  min-width: 0;
  overflow-wrap: anywhere;
}
.decision-group li + li {
  margin-top: .9rem;
  padding-top: .9rem;
  border-top: 1px solid var(--line);
}

/* Badges / buttons */
.badge {
  display: inline-block;
  margin: .08rem .18rem .08rem 0;
  padding: .16rem .55rem;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-deep);
  font-family: var(--sans);
  font-size: .72rem;
  font-weight: 750;
  letter-spacing: .01em;
  line-height: 1.3;
}
.badge.warning { background: var(--warning-soft); color: var(--warning); }
.badge.critical { background: var(--critical-soft); color: var(--critical); }
button {
  border: 1px solid rgba(15, 118, 110, .22);
  border-radius: .5rem;
  background: var(--accent-soft);
  color: var(--accent-deep);
  padding: .38rem .7rem;
  font: inherit;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
}
button:hover { background: #bfece4; }
.copy-status {
  margin-left: .45rem;
  color: var(--muted);
  font-size: .84rem;
}

/* Findings */
.finding-queue { display: grid; gap: .75rem; }
.finding-disclosure {
  scroll-margin-top: 5.75rem;
  padding: .9rem 1rem 1rem;
  border-left: .28rem solid color-mix(in srgb, var(--accent) 70%, var(--warm-accent));
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 28%, #fff), var(--surface));
}
.finding-disclosure[open] {
  border-left-color: var(--accent-deep);
  box-shadow: var(--shadow);
}
.finding-disclosure > summary {
  display: grid;
  grid-template-columns: minmax(6.5rem, auto) 1fr;
  gap: .3rem .65rem;
  align-items: center;
  cursor: pointer;
}
.finding-id { font-size: 1rem; }
.finding-meta {
  color: var(--muted);
  font-size: .86rem;
  line-height: 1.45;
}
.finding-rank {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: .86rem;
  font-weight: 400;
  line-height: 1.45;
}
.finding-body {
  margin-top: .8rem;
  padding-top: .8rem;
  border-top: 1px solid var(--line);
}
.finding-block + .finding-block,
.copy-request {
  margin-top: .9rem;
  padding-top: .9rem;
  border-top: 1px solid var(--line);
}
.copy-request p { white-space: pre-wrap; }
.finding-card {
  margin-top: 1rem;
  border-left: .3rem solid var(--accent);
  scroll-margin-top: 5.75rem;
}
.finding-card.secondary { border-left-color: var(--line-strong); }

/* Tables / diagrams / details */
table {
  display: block;
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  border-collapse: collapse;
}
th, td {
  padding: .55rem .7rem;
  border-bottom: 1px solid var(--line);
  text-align: left;
  font-size: .92rem;
}
th {
  background: linear-gradient(90deg, var(--accent-soft), color-mix(in srgb, var(--warm-soft) 70%, #fff));
  color: var(--accent-deep);
  font-weight: 700;
}
tr:last-child td { border-bottom: none; }

details { padding: .85rem 1rem; }
details > summary {
  cursor: pointer;
  font-weight: 800;
}
details.sources {
  padding: .5rem 0 0;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.diagram { margin: 1rem 0 0; }
.diagram-target {
  min-height: 0;
  overflow-x: auto;
  padding: .2rem 0;
}
.diagram-target svg {
  max-width: 100%;
  height: auto;
}
.diagram-source {
  overflow-x: auto;
  margin: 0;
  padding: .9rem 1rem;
  border-radius: .65rem;
  background: #16332f;
  color: #e7f8f4;
  white-space: pre;
  font-family: var(--mono);
  font-size: .84rem;
  line-height: 1.45;
}
.diagram-fallback {
  color: var(--muted);
  font-style: italic;
}
.diagram-error[role="alert"] {
  color: var(--critical);
  font-weight: 700;
}
.diagram-debug { margin-top: .7rem; }

.empty {
  color: var(--muted);
  font-style: italic;
}

/* Responsive */
@media (max-width: 820px) {
  header { position: static; }
  .header-inner {
    align-items: flex-start;
    flex-direction: column;
  }
  nav {
    width: 100%;
    border-radius: .85rem;
  }
  .decision-board { grid-template-columns: 1fr; }
  .finding-disclosure > summary { grid-template-columns: 1fr; }
  .page { padding-bottom: 3.5rem; }
}

/* Print */
@media print {
  @page { margin: 1.5cm; }
  body { background: #fff; }
  header {
    position: static;
    background: #fff;
    backdrop-filter: none;
  }
  nav, button, .copy-status { display: none !important; }
  .card,
  details,
  .decision-group,
  .finding-disclosure,
  .metric,
  table {
    box-shadow: none;
    break-inside: avoid;
  }
  details { border: 1px solid #999; }
  details > summary { display: block; }
  details > *:not(summary) { display: block; }
  .finding-body, .diagram-debug { border-top-color: #999; }
  .diagram-target:empty { display: none; }
  .diagram-fallback, .diagram-debug { display: block; }
  .diagram-error[hidden] { display: none; }
  .diagram-source {
    background: #fff;
    color: #000;
    border: 1px solid #999;
  }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <div class="eyebrow">Wayfinder · ${slug} · generato il ${generated_at}</div>
      <h1>${title}</h1>
      <span class="badge">${status_label}</span>
    </div>
    <nav aria-label="Sezioni del report">
      <a href="#overview">Panoramica</a>
      <a href="#solution">Soluzione</a>
      <a href="#decisions">Decisioni</a>
      <a href="#scope">Ambito</a>
      <a href="#reading">Lettura</a>
      <a href="#review">Revisione</a>
    </nav>
  </div>
</header>
<main class="page">
  <p class="lede">${destination}</p>
  <div class="metrics">${metrics}</div>
  ${body}
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.min.js"
        integrity="sha384-zkWMJO4sgpPUzyuOgDx8HB/K55glbAwajEpk1Go2NWRuPkPA/wIhoEJTuSkmOYrV"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  function showDiagramError(figure) {
    var error = figure.querySelector('.diagram-error');
    if (!error) { return; }
    error.textContent = 'Diagramma non renderizzato: sintassi Mermaid non valida.';
    error.hidden = false;
  }

  if (window.mermaid) {
    window.mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      flowchart: { htmlLabels: false }
    });
    var figures = document.querySelectorAll('.diagram');
    figures.forEach(function (figure, index) {
      var source = figure.querySelector('.diagram-source');
      var target = figure.querySelector('.diagram-target');
      var fallback = figure.querySelector('.diagram-fallback');
      if (!source || !target) { return; }
      Promise.resolve(window.mermaid.parse(source.textContent))
        .then(function () {
          return window.mermaid.render('wayfinder-diagram-' + index, source.textContent);
        })
        .then(function (result) {
          target.innerHTML = result.svg;
          if (fallback) { fallback.hidden = true; }
        })
        .catch(function (error) {
          showDiagramError(figure);
        });
    });
  }

  var copyButtons = document.querySelectorAll('[data-copy-target]');
  if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') {
    return;
  }
  copyButtons.forEach(function (button) {
    button.hidden = false;
    button.addEventListener('click', function () {
      var request = document.getElementById(button.getAttribute('data-copy-target'));
      var status = button.parentElement.querySelector('.copy-status');
      if (!request || !status) { return; }
      navigator.clipboard.writeText(request.textContent)
        .then(function () {
          status.textContent = 'Copiata';
        })
        .catch(function (error) {
          status.textContent = 'Copia non riuscita';
        });
    });
  });
})();
</script>
</body>
</html>
