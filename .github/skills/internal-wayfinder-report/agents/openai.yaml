interface:
  display_name: "Internal Wayfinder Report"
  short_description: "Render and audit a local Wayfinder workspace"
  default_prompt: "Use /internal-wayfinder-report on an active tmp/.wayfinder/<analysis-slug>/ workspace. Read map.md, analysis.md, and local issues, write report/report.json with useful evidence-backed diagrams, run the bundled renderer with --data for the single-page index.html, and leave all Wayfinder sources unchanged."
