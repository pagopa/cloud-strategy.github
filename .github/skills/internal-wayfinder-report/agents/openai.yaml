interface:
  display_name: "Internal Wayfinder Report"
  short_description: "Render and audit a local Wayfinder workspace"
  default_prompt: "Use /internal-wayfinder-report on an active tmp/.wayfinder/<analysis-slug>/ workspace. Read each source path once in a bounded pass, write the generic five-section report with overview and review diagrams, run the bundled renderer with --check --format json before rendering the single-page index.html, preserve source hashes, and report warnings and to-verify findings. After sources, authority, report structure, acceptance, and validation are fixed, you may invoke internal-luna-executor through /internal-subagent-contract with one DelegationBrief v1 for evidence inventory or drafting; verify the adapter-composed WorkerResult v1 plus caller-owned VerificationReceipt v1 and retain source authority, findings, diagram relationships, retry choice, acceptance, and final validation here."
