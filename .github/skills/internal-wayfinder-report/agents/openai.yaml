interface:
  display_name: "Internal Wayfinder Report"
  short_description: "Render and audit a local Wayfinder workspace"
  default_prompt: "Use /internal-wayfinder-report on an active tmp/.wayfinder/<analysis-slug>/ workspace. Read each source path once in a bounded pass, write the generic five-section report with overview and review diagrams, run the bundled renderer with --check --format json before rendering the single-page index.html, preserve source hashes, and report warnings and to-verify findings. You may invoke internal-luna-executor for evidence inventory or report drafting after the relevant sources, authority, report structure, and validation are fixed; retain source authority, findings, diagram relationships, and final validation here."
