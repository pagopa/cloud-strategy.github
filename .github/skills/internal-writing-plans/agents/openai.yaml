interface:
  display_name: "Internal Writing Plans"
  short_description: "Repo wrapper for current-only numbered plan authoring"
  default_prompt: "Use $internal-writing-plans to author retained repository-owned numbered plans under tmp/superpowers. Choose compact (default: summary, ledger, execution, questions) or extended (adds implementation contract). Write 01-change-summary.md in Italian with Risorsa|Azione|Scopo table. All other files in English. Reject unsupported profiles. Run bundle-local CLI for deterministic handoff-check before transition to internal-executing-plans. Emit a Decision Brief before handoff."
