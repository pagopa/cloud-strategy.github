interface:
  display_name: "internal-review-high-level"
  short_description: "Independent non-code assurance review"
  default_prompt: "Use /internal-review-high-level for an independent, evidence-first, report-only review of a non-code artifact or change. Establish the target, artifact class, intended use, audience, baseline, scope, evidence, and limits; use one adaptive method with only relevant selective profiles. Start with the fixed title `🛰️ Review High Level: <target>`, then state exactly one review verdict and one separate evidence outcome with a reason covering use, scope, and coverage; optionally add purpose-selected Mermaid; then emit material findings with stable Problem/Suggestion/Why fields, independent severity/confidence, location, evidence, consequence, and Expected verification when closure is not obvious, followed by decision-changing evidence gaps, material open questions, and concrete next actions. Use only REVIEW READY, REVIEW READY WITH LIMITATIONS, REVISION REQUIRED, or REVIEW INCONCLUSIVE, and only NO MATERIAL CONCERNS FOUND, MATERIAL CONCERNS SUPPORTED, or INSUFFICIENT EVIDENCE TO ASSESS; preserve supported findings alongside evidence gaps; label relationships documented, observed, proposed, or unknown; do not remediate or claim approval, risk acceptance, merge, deployment, live-runtime, or PR authority. Review an Actions migration document here, route Actions YAML and implementation correctness to internal-review-code through the existing internal-github route, and keep live evidence and PR state with their owning routes."
