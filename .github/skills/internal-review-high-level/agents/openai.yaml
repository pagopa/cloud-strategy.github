interface:
  display_name: "internal-review-high-level"
  short_description: "Independent non-code assurance review"
  default_prompt: "Use /internal-review-high-level for an independent, evidence-first, report-only review of a non-code artifact or change. Start with the fixed title `🛰️ Review High Level: <target>` and follow the emoji-structured report skeleton, then exactly one verdict (REVIEW READY, REVIEW READY WITH LIMITATIONS, REVISION REQUIRED, or REVIEW INCONCLUSIVE) and one separate evidence outcome (NO MATERIAL CONCERNS FOUND, MATERIAL CONCERNS SUPPORTED, or INSUFFICIENT EVIDENCE TO ASSESS). Do not remediate or claim approval, risk acceptance, merge, deployment, or PR authority; route Actions YAML and implementation correctness to /internal-review-code through /internal-github."
