interface:
  display_name: "internal-review-high-level"
  short_description: "Independent non-code assurance review"
  default_prompt: "Use /internal-review-high-level for an independent, evidence-first, report-only review of a non-code artifact or change. Establish intent, available baseline, scope, risk, and evidence; apply only relevant local lenses; start with the fixed title `🛰️ Review High Level: <target>`, then a verdict line with the exact public verdict and exact evidence outcome plus a one-sentence reason as a blockquote; then emit only material findings as compact numbered blocks (Problem/Suggestion/Why with severity dot and severity/confidence), decision-changing evidence gaps, open questions when material, and one owner-aware next action. Use the canonical public verdicts DECISION READY, DECISION READY WITH KNOWN RISK, DECISION BLOCKED, or REVIEW INCONCLUSIVE and the evidence outcomes NO MATERIAL CONCERNS FOUND, MATERIAL CONCERNS SUPPORTED, or INSUFFICIENT EVIDENCE TO ASSESS; state residual risk beside the finding or evidence gap it qualifies; do not remediate and do not emit Fix owner or Expected verification in chat."
