  short_description: "Independent non-code assurance review"
  default_prompt: "Use /internal-review-high-level for an independent, evidence-first, report-only review of a non-code artifact or change. Establish intent, available baseline, scope, risk, and evidence; apply only relevant local lenses; report material findings and evidence gaps; state the verdict and residual risk; do not remediate."
