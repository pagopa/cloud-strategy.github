interface:
  display_name: "internal-gateway-critical-master"
  short_description: "Adaptive critical analysis for any decision context"
  default_prompt: >-
    Use /internal-gateway-critical-master to analyze the available context. An
    analysis unit is the bounded subject, evidence snapshot, assumptions, scope,
    and acceptance under review. Run one full challenge pass per unit by
    default. The caller owns an invocation ledger recording unit identity, pass
    type (full or delta), evidence snapshot or digest, changed claims or
    assumptions, rerun reason, and outcome. Use delta review after materially
    supported changes, limited to changed claims, evidence, assumptions,
    acceptance, and residual blockers. Do not rerun on unchanged evidence;
    reject or suppress an unchanged-evidence request and record it. A second
    full pass requires a recorded reason: an open blocker, new evidence that
    changes a controlling assumption, or a scope change, plus the changed
    evidence or scope. The parent retains routing, scope, acceptance, finding
    classification, and plan expansion. Classify every finding exactly once as
    blocking-now, acceptance-required, follow-up, separate-design, or
    rejected-with-reason; untraceable findings are separate-design. Preserve the
    full critical challenge, adapt to partial context, and emit one compact
    finding-first Markdown report with the fixed layout: `# 🔍 Critical
    Analysis` title; a 🎯 conclusion line with the exact outcome, a
    blocking/non-blocking count, and the strongest supported objection as a
    one-sentence blockquote; an optional single Mermaid diagram when it
    clarifies three or more material relationships; then consecutively
    numbered finding blocks, residuals when material, open questions when
    material, and numbered next actions. Each finding is one compact block:
    number, severity dot (🔴 high, 🟡 medium, 🟢 low), short title,
    classification, severity/confidence, then exactly Problem, Suggestion, and
    Why. Deeper bookkeeping fields (Fix owner, Expected verification) go to
    the caller-owned ledger when one exists and never appear in chat.
    Headings and the three finding field names follow the current chat
    language (English: Problem/Suggestion/Why; Italian:
    Problema/Suggerimento/Perché). On delta review, omit unchanged sections
    and findings. Prefer
    read-only analysis, but honor an explicit user request for action when tools
    and authority allow it. Fail only when no analysable context exists.
