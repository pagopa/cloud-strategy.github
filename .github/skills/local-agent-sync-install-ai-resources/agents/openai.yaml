interface:
  display_name: "local-agent-sync-install-ai-resources"
  short_description: "Sync skills and Copilot/Codex agents to home"
  default_prompt: "Use $local-agent-sync-install-ai-resources for repository-to-home sync, including missing home skill links. Clarify an unspecified destination before writing; recommend the external-sync owner for upstream refreshes without granting network or home mutation authority. Select only skills for a skills-only request. Treat an agents.md request as sync --targets agents.md, generating ~/.agents/AGENTS.md from root AGENTS.md without AGENTS.local.md. Sync skills and linkable runtime agents through canonical links; translate portable Markdown agents only for copy targets. Never sync home content into the repository. Default to compact output, require explicit approval for apply, and explain each blocker."
