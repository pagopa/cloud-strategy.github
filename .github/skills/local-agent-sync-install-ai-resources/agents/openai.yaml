interface:
  display_name: "Home AI Resource Sync"
  short_description: "Sync skills and Copilot/Codex agents to home"
  default_prompt: "Use $local-agent-sync-install-ai-resources for repository-to-home sync. Treat an agents.md request as sync --targets agents.md, generating ~/.agents/AGENTS.md from root AGENTS.md without the optional AGENTS.local.md policy. Sync skills with managed absolute links, Copilot agents as repository links, and native Codex TOML agents as repository links; translate Markdown agents only for copy targets. Never sync home content into the repository. Default to compact output, require explicit approval for apply, and explain each blocker in plain language."
