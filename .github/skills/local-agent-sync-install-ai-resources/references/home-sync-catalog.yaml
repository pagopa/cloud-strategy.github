version: 1
defaults:
  include_internal_skills: true
  include_local_skills: false
  include_unlisted_skills: true
  unmanaged_existing_skills_policy: repo-wins
  excluded_skills:
    - graphify
  skill_targets:
    - codex
    - copilot
    - opencode
resources:
  - resource_id: global-agents
    source_family: agents-md
    source_path: AGENTS.md
    include_targets:
      - agents.md
    target_support: See runtime support matrix
    notes: Portable global baseline generated without optional AGENTS.local.md policy.
  - resource_id: internal-tf
    source_family: skills
    source_path: .github/skills/internal-tf
    include_targets:
      - codex
      - copilot
      - opencode
    target_support: See runtime support matrix
    notes: Explicitly sync-managed Terraform configuration skill bundle.
  - resource_id: internal-low-cost-copilot
    source_family: agents
    source_path: .github/agents/internal-low-cost-copilot.agent.md
    include_targets:
      - copilot
    target_support: See runtime support matrix
    notes: Native Copilot low-cost worker profile.
  - resource_id: internal-low-cost-codex
    source_family: agents
    source_path: .codex/agents/internal-low-cost-codex.toml
    include_targets:
      - codex
    target_support: See runtime support matrix
    notes: Native Codex low-cost worker profile.
