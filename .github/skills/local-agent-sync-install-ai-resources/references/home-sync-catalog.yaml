version: 1
defaults:
  include_internal_skills: true
  include_local_skills: false
  include_unlisted_skills: true
  unmanaged_existing_skills_policy: repo-wins
  excluded_skills:
    - graphify
  skill_targets:
    - codex
    - copilot
    - opencode
resources:
  - resource_id: internal-gateway-idea-brainstorming
    source_family: agents
    source_path: .github/agents/internal-gateway-idea-brainstorming.agent.md
    include_targets:
      - codex
      - copilot
      - opencode
    target_support: See runtime support matrix
    notes: Gateway agent for substantive idea definition and brainstorming.
  - resource_id: internal-gateway-review
    source_family: agents
    source_path: .github/agents/internal-gateway-review.agent.md
    include_targets:
      - codex
      - copilot
      - opencode
    target_support: See runtime support matrix
    notes: Gateway agent for staged workflow orchestration.
  - resource_id: internal-gateway-critical-master
    source_family: agents
    source_path: .github/agents/internal-gateway-critical-master.agent.md
    include_targets:
      - codex
      - copilot
      - opencode
    target_support: See runtime support matrix
    notes: Gateway agent for critical challenge and pressure testing.
  - resource_id: internal-gateway-simple-task
    source_family: agents
    source_path: .github/agents/internal-gateway-simple-task.agent.md
    include_targets:
      - codex
      - copilot
      - opencode
    target_support: See runtime support matrix
    notes: Gateway agent for simple fast-path tasks.
