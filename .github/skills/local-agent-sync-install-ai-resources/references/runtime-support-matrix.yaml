version: 1
rows:
  - target: agents.md
    resource_family: agents-md
    support_level: Documented
    home_path: ~/.agents/AGENTS.md
    direct_copy_possible: true
    translation_required: false
    include_in_v1: true
    evidence:
      - Root AGENTS.md declares the shared baseline as the source for ~/.agents/AGENTS.md.
    notes: Copy the portable root policy projection without optional AGENTS.local.md policy.
  - target: skills
    resource_family: skills
    support_level: Documented
    home_path: ~/.agents/skills/<skill>/
    direct_copy_possible: true
    translation_required: false
    include_in_v1: true
    evidence:
      - https://code.visualstudio.com/docs/copilot/customization/agent-skills
    notes: Shared Agent Skills direct-copy bundle support via ~/.agents/skills/.
  - target: codex
    resource_family: skills
    support_level: Documented
    home_path: ~/.agents/skills/<skill>/
    direct_copy_possible: true
    translation_required: false
    include_in_v1: true
    evidence:
      - https://developers.openai.com/codex/skills
    notes: Direct-copy bundles with SKILL.md, references, scripts, assets, and agents/openai.yaml.
  - target: copilot
    resource_family: skills
    support_level: Documented
    home_path: ~/.agents/skills/<skill>/
    direct_copy_possible: true
    translation_required: false
    include_in_v1: true
    evidence:
      - https://code.visualstudio.com/docs/copilot/customization/agent-skills
    notes: GitHub Copilot supports Agent Skills standard via ~/.agents/skills/.
  - target: opencode
    resource_family: skills
    support_level: Documented
    home_path: ~/.agents/skills/<skill>/
    direct_copy_possible: true
    translation_required: false
    include_in_v1: true
    evidence:
      - https://opencode.ai/docs/skills
    notes: OpenCode supports Agent Skills standard via ~/.agents/skills/.
  - target: codex
    resource_family: agents
    support_level: Documented
    home_path: ~/.codex/agents/
    direct_copy_possible: true
    translation_required: true
    include_in_v1: true
    evidence:
      - https://developers.openai.com/codex/agents
    notes: Native TOML agents use canonical repository links; portable Markdown agents use TOML translation copies.
  - target: copilot
    resource_family: agents
    support_level: Documented
    home_path: ~/.copilot/agents/
    direct_copy_possible: true
    translation_required: false
    include_in_v1: true
    evidence:
      - https://code.visualstudio.com/docs/copilot/customization/custom-agents
    notes: .agent.md files are supported as canonical links to repository sources.
  - target: opencode
    resource_family: agents
    support_level: Documented
    home_path: ~/.config/opencode/agents/
    direct_copy_possible: true
    translation_required: true
    include_in_v1: true
    evidence:
      - https://opencode.ai/docs/agents/
    notes: Native Markdown agents under .opencode/agents/ use canonical repository links; portable Markdown agents use OpenCode translation copies.
