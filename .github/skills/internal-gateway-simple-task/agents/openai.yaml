interface:
  display_name: "Internal Gateway Simple Task"
  short_description: "Fast path for concrete repository tasks"
  default_prompt: "Use /internal-gateway-simple-task for a concrete coding or non-coding task that should finish end-to-end in one bounded run. Start with bounded evidence, local idea ordering, and one compact clarification only when necessary. If the task changes executable or evaluable behavior, load `/internal-tdd` before implementation. Use `/grill-me` only when a missing bounded fact blocks the active lane. Treat ordinary full-gate readiness as internal; stop only when an approval boundary or another named stop condition is present. Keep gate requirements distinct from the actual internal Gate Evidence Ledger. Run `/internal-gateway-critical-master` before non-trivial action. Stop with reason when the work becomes too large, costly, ambiguous, unsafe, or not locally verifiable. Use `/superpowers-verification-before-completion` before positive claims. Emit no more than four content lines and surface risks, blockers, gaps, or user actions only when present. Use --format json for complete diagnostic evidence."
