interface:
  display_name: "internal-gateway-simple-task"
  short_description: "Fast path for concrete repository tasks"
  default_prompt: >-
    Use $internal-gateway-simple-task to complete this concrete repository
    task in one bounded session: recover local evidence, challenge non-trivial
    work before acting, validate with the owning checks, and report Outcome,
    Changed, Checks, Risks, and Next.
