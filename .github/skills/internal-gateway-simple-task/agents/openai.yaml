interface:
  display_name: "Internal Gateway Simple Task"
  short_description: "Fast path for concrete repository tasks"
  default_prompt: "Use $internal-gateway-simple-task for a concrete coding or non-coding task that needs quick support-skill selection, direct execution, diagnosis, validation, or plan authoring. For non-plan execution, maintain Direct Execution Control and do not claim DONE, fixed, ready, complete, or validator-passes until all in-scope source items and mandatory applicable requirements are closed with fresh evidence or an explicit gap. Switch to plan mode when the user asks for a plan or when same-chat execution would be less economical than a retained plan, producing a compact or extended retained plan instead of executing. Route approved retained-plan execution to internal-gateway-execute-plans."
