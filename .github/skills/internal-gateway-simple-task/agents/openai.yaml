interface:
  display_name: "Internal Gateway Simple Task"
  short_description: "Fast path for concrete repository tasks"
  default_prompt: "Use $internal-gateway-simple-task for a concrete coding or non-coding task that should finish end-to-end in one bounded run. Start with bounded evidence, local idea ordering, and one compact clarification only when necessary. Use `grill-me` when the task is non-trivial, run `internal-gateway-critical-master` before non-trivial action, stop with reason when the work becomes too large, costly, ambiguous, unsafe, or not locally verifiable, and use `superpowers-verification-before-completion` before positive claims."
