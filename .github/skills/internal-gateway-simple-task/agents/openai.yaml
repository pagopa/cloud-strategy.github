interface:
  display_name: "Simple Task Internal Gateway"
  short_description: "Fast path for concrete repository tasks"
  default_prompt: >-
    Use /internal-gateway-simple-task for concrete repository-owned
    low-to-medium-risk work that can finish in one bounded session. For each
    concrete non-trivial task, own one canonical Internal Execution Brief with
    the request/outcome, scope/anti-scope/owner/route,
    constraints/authority/assumptions/open facts, local evidence/proposed
    direction/rejected alternative, acceptance/native validation/pass-fail
    signal, stop conditions/dependencies/handoff, and state/evidence
    delta/current decisions. Keep same-session briefs in working context;
    pause/resume may materialize only one uncommitted disposable
    tmp/briefs/<slug>.md, and promotion transfers authority to
    /internal-gateway-writing-plans. Supporting skills contribute evidence but
    do not create competing briefs; /internal-gateway-idea and
    /internal-gateway-writing-plans remain the heavier routes. Require explicit
    authority before live external operations, use a safe local fallback when
    available, and stop fail-closed otherwise. Close out with one canonical
    ledger and fresh focused plus broader evidence, without numeric thresholds.
    Inspect local evidence first, use /grill-me only for one unrecoverable
    material fact, and run /internal-gateway-critical-master before non-trivial
    action. Allow one evidence-backed reformulation and re-critique when new
    evidence changes a rejected plan. Classify prompt or skill-only edits as
    validation-only under /internal-tdd. Load
    /addyosmani-code-simplification only for explicit simplification work.
    Delegate non-trivial work to internal-luna-executor unless the caller is
    GPT-5.6 Luna; unknown identity defaults to delegation. Stop with the exact
    violated condition, evidence, and required next decision. Use
    /superpowers-verification-before-completion before positive claims.
