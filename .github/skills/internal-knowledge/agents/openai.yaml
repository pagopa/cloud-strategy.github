interface:
  display_name: "internal-knowledge"
  short_description: "Evidence-based repository knowledge authoring"
  default_prompt: "Use $internal-knowledge when creating, aligning, or materially refreshing repository knowledge documents; resolve one mode first (help to answer read-only with the intent, the mode, the destinations at stake, and the prompt to run, targeted for explicit destinations, refresh when the declared knowledge layout is already realized, bootstrap when it is absent, incomplete, or contradicted), read the repository's own layout declaration instead of imposing one, account for every row of the evidence-to-artifact table so that standards, principles, and guides are planned or ledgered rather than passed over in silence, enumerate the closed promotion list with a verdict per signal and promote an area to its own domain when two are evidenced, check a manifest's own entries before excluding a path as managed, present a preflight plan with the exclusion ledger and one Mermaid diagram before writing in refresh and bootstrap, apply the mechanical unchanged predicate, write at most one wave and name what limits it, resolve every obligation of the authoring reference inside each document as it is written including its diagram disposition rather than deferring one to a later wave, and report changed paths, evidence, what each validator actually covered, and the enforcement gap without ever creating a workflow, action, validator, or coverage manifest."
