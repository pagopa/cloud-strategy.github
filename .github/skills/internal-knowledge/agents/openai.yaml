interface:
  display_name: "internal-knowledge"
  short_description: "Evidence-based repository knowledge authoring"
  default_prompt: "Use $internal-knowledge when creating, aligning, or materially refreshing repository knowledge documents. Resolve one mode first: help answers read-only with the intent, mode, destinations, and prompt to run; targeted uses explicit destinations; sync applies when the declared layout is realized; setup applies when it is absent, incomplete, or contradicted. Honor a readme or docs bucket as a filter. Follow SKILL.md and its bundle-local references: knowledge-scope.md owns exact targeted allowlists, evidence accounting, material-omission and unchanged decisions, and completion; knowledge-topology.md owns domain and artifact decisions; each artifact reference owns its structure. Sync and setup may record considered, not evidenced and never create from a signal alone. Keep one detailed owner per rule, preserve reader-proportional evidence, accepted ADR bodies, and generated blocks, keep the bundle self-contained, and report the enforcement gap without creating workflows, actions, validators, or coverage manifests."
