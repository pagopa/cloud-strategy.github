interface:
  display_name: "internal-gateway-writing-plans"
  short_description: "Approved implementation-plan writing"
  default_prompt: >-
    Use /internal-gateway-writing-plans to write one retained plan through
    /superpowers-writing-plans once eligibility holds: an explicit plan
    request, a source, and a known target and anti-scope. Save it under
    tmp/superpowers/plans/, set the Spec header, name
    /internal-gateway-execute-plans as the executor, record one /internal-tdd
    posture per task, keep every touched path in Files: blocks, write no commit
    steps, and close with the Inline-or-Subagent handoff question. Report
    Plan, Scope, and Next only.
