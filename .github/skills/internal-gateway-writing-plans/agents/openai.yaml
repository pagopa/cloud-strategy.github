interface:
  display_name: "internal-gateway-writing-plans"
  short_description: "Approved implementation-plan writing"
  default_prompt: >-
    Use /internal-gateway-writing-plans only after an explicit request, a
    source, and a known target and anti-scope. Preflight exact authority for
    every selected planner output and pass explicit destination overrides;
    defaults do not grant extra artifacts. Pass accepted decisions, the
    verified source comparison, repository deltas, and the unchanged authority
    envelope to /addyosmani-planning-and-task-breakdown. Let that planner own
    decomposition, template, checkpoints, and quality. Return the exact plan
    path and every actual task target with criteria, dependencies, verification,
    and human checkpoints. Do not reconstruct missing tasks, mutate Git, create
    runtime state, or start execution. Route explicit approval to
    /internal-gateway-execute-plans and preserve user work.
