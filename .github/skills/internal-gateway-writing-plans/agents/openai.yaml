interface:
  display_name: "Internal Gateway Writing Plans"
  short_description: "Repo wrapper for current-only numbered plan authoring"
  default_prompt: >-
    Use $internal-gateway-writing-plans to author retained repository-owned
    numbered plans under tmp/superpowers. For new plans, run the bundle-local
    init scaffold first, then author content. Choose compact (summary + merged
    execution/control) or extended (summary + control + numbered execution
    files).
    New compact plans should use mini-plan-* folders. Write
    01-change-summary.md in Italian with Risorsa|Azione|Scopo table and
    Esecuzione prevista route notes. All other files in English. Reject
    unsupported profiles. Run bundle-local CLI audit first and handoff-check
    second for deterministic readiness. Treat token warnings as review inputs
    for compression or split decisions, not as measured-savings proof. Do not
    write a Recommended consumer field into the retained plan. Leave execution
    strategy selection to $internal-gateway-execute-plans, which will infer the
    best execution path from profile, folder shape, and validation path. Keep
    implementation-contract content merged in 02-control.md for extended and
    avoid cross-file fact duplication. Emit a Decision Brief before handoff.
