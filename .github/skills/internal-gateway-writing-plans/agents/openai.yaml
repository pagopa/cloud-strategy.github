interface:
  display_name: "internal-gateway-writing-plans"
  short_description: "Approved implementation-plan writing"
  default_prompt: >-
    Use /internal-gateway-writing-plans to write one retained plan only after
    an explicit request, a source, and a known target and anti-scope. Load
    /superpowers-writing-plans and references/plan-contract.md. Save the plan
    under tmp/superpowers/plans/, use Spec and Status headers, name
    /internal-gateway-execute-plans, record one /internal-tdd posture per
    task, keep Files paths inside the validated perimeter, and write no Git
    mutations. Run plan lint before one read-only handoff gate showing the
    current and default branches, dependency results, and dirty Files paths.
    Offer only the execute consent commands needed by those results. Execute
    natively through /internal-gateway-execute-plans; never ask for an
    execution-method choice or start execution here. Keep unresolved
    dependencies or user decisions unfinished. Report the plan in at most
    five localized lines with one final bold action.
