interface:
  display_name: "Internal Gateway Writing Plans"
  short_description: "Repo wrapper for current-only numbered plan authoring"
  default_prompt: "Use $internal-gateway-writing-plans to author retained repository-owned numbered plans under tmp/superpowers. Choose compact (default: summary, ledger, execution, questions) or extended (adds implementation contract). New compact plans should use mini-plan-* folders. Write 01-change-summary.md in Italian with Risorsa|Azione|Scopo table and Esecuzione prevista route notes. All other files in English. Reject unsupported profiles. Run bundle-local CLI for deterministic handoff-check before transition to internal-gateway-execute-plans. Emit a Decision Brief before handoff."
