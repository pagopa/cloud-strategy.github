interface:
  display_name: "Internal Gateway Writing Plans"
  short_description: "Approved implementation-plan writing"
  default_prompt: >-
    Use $internal-gateway-writing-plans to capture Target, Anti-scope,
    Nearest owner, Validation path, Stop conditions, and Observable acceptance.
    Then load $superpowers-writing-plans and delegate the approved implementation plan
    writing outcome. The delegated draft remains draft-only until the local acceptance gate
    passes. Persist the plan under `tmp/superpowers/plans/YYYY-MM-DD-HHMM-<feature-name>.md`.
    After the local acceptance gate passes, name $internal-gateway-execute-plans as the
    next owner. Stop after reporting the accepted plan path. Observe the No-Commit Rule:
    no git mutations during writing.
