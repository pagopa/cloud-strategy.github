interface:
  display_name: "Internal Gateway Writing Plans"
  short_description: "Approved implementation-plan writing"
  default_prompt: >-
    Use /internal-gateway-writing-plans after approval to capture the target,
    anti-scope, nearest owner, validation path, stop conditions, and observable
    acceptance. Load /superpowers-writing-plans to produce one reviewable plan
    under tmp/superpowers/plans/ with ordered actionable tasks, concrete file
    targets, focused validation, and an execution handoff. Perform human review
    for scope, safety, actionability, validation, and handoff quality. Do not
    create a writer-local validator or draft-only lifecycle. Report the plan
    path, name /internal-gateway-execute-plans as the next owner, and wait for
    explicit execution approval. Observe the No-Commit Rule: no Git mutations
    during writing.
