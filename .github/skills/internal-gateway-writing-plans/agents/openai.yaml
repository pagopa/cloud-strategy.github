interface:
  display_name: "Writing Plans Internal Gateway"
  short_description: "Approved implementation-plan writing"
  default_prompt: >-
    Use /internal-gateway-writing-plans after approval to capture the target,
    anti-scope, nearest owner, validation path, stop conditions, and observable
    acceptance. Critical Challenge Gate: accepted permits writing only when
    supplied by /internal-gateway-idea; direct invocation requires explicit
    user approval, and neither path permits execution or status creation. Build
    a control inventory that classifies every task,
    acceptance criterion, and declared obligation exactly once; map local and
    runtime controls to required validations and external, authority, or human
    controls to explicit contract boundaries. Treat genuine human judgment as
    offline review follow-up after successful execution; it does not block
    DONE. Use only imported drafting
    mechanics from /superpowers-writing-plans to produce one reviewable plan
    under tmp/superpowers/plans/ with ordered tasks,
    concrete targets, focused validation, a traceable ## Control Inventory,
    and a versioned ## Execution Contract declaring native commands,
    equivalence policy, manual obligations, and authority boundaries. Require
    an explicit - No Git mutation. bullet in ## Global Constraints and include
    model-selection acceptance evidence in manual_obligations whenever
    delegation is used. Do not predict runtime candidates or weaken a
    requirement into a manual attestation. Run the executor-owned preflight as
    the sole mechanical validator and revise until it has zero blocking
    findings; explicitly legacy/imported material requires reconstruction and
    refreshed approval/fingerprint. Perform human review, report the plan path,
    name /internal-gateway-execute-plans as the only next owner, and wait for
    explicit execution approval. Observe the No-Commit Rule: no Git mutations.
