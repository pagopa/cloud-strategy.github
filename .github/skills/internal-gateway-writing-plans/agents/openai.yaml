interface:
  display_name: "Internal Gateway Writing Plans"
  short_description: "Repository preflight wrapper for superpowers-writing-plans"
  default_prompt: >-
    Use $internal-gateway-writing-plans to capture Target, Anti-scope,
    Nearest owner, Validation path, Stop conditions, and Observable acceptance.
    Then load $superpowers-writing-plans and delegate the writing outcome. If a
    retained plan is created, check ordered tasks, concrete file targets, edit
    intent, validation commands or explicit gaps, duplicate-owner or
    speculative-scope drift, stop conditions, and handoff readiness. Stop after
    the writing outcome.
