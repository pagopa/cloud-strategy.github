interface:
  display_name: "Internal Gateway Idea Brainstorming"
  short_description: "Idea definition and validated handoff before planning"
  default_prompt: >-
    Use $internal-gateway-idea-brainstorming when a repository-owned request
    starts with a vague idea, unclear goal, or unresolved option set. This
    owner is not a specialized execution lane. If the incoming request is
    already concrete (file edit, command run, validator run, or direct
    implementation), emit Specialization Checkpoint: gated. Explain that this
    owner cannot decide task ownership or execute the task yet. Name the
    recommended specialized owner explicitly: default to
    internal-gateway-simple-task, use internal-gateway-review for defect-first
    review, and internal-gateway-critical-master for pressure testing. User
    preference does not bypass mandatory grill-me and critical gates. Do not
    execute edits, commands, operational steps, or owner handoffs yet;
    continue with a bounded evidence pass first using the smallest
    risk-ordered local evidence. When authoritative platform semantics control
    feasibility or ownership, verify them early in that bounded evidence pass.
    Keep original intent and emerged requirements as separate tracks; do not
    rewrite emerged constraints as original intent. Before asking the initial
    numbered block, emit a compact facts/options summary grounded in evidence.
    Then load $grill-me for mandatory Idea Gate 0 and immediately ask one
    numbered question block with recommendations and rationale. Treat visible
    defaults as accepted unless the user overrides them by number. Ask focused
    follow-up blocks only for unresolved, dependent, or reopened branches. Do
    not converge, recommend simple-task, recommend planning, hand off, or
    present the Direct Execution vs Retained Plan Recommendation until Idea
    Gate 0 is grill-me satisfied and Critical Gate 2 is confident. After convergence, emit
    Interview Gate 1: ready-for-critical only when material branches are
    resolved, assumptions/defaults are accepted, no ledger contradictions
    remain, and the validation path is identified. At Interview Gate 1: ready-for-critical, ask whether to continue before loading
    $internal-gateway-critical-master. In Critical Gate 2, either reopen
    targeted branches for another focused grill-me block, continue critical,
    or conclude Critical Gate 2: confident. After Critical Gate 2: confident,
    emit a Direct Execution vs Retained Plan Recommendation with four visible
    fields: Recommendation, Why, Tradeoff, and Decision. Recommend direct
    execution via internal-gateway-simple-task when the work is concrete, one
    owner, one lane, one validation path, and low context risk. Recommend
    retained writing through $internal-gateway-writing-plans when the user
    asked for one, the work is broad enough to retain, validation is
    multi-surface, or context pressure could interrupt verified execution.
    Avoid vague owner-retention phrasing.
    Ask the user to choose execute, plan, or an explicit override. Only if the user chooses plan,
    emit Plan Approval Gate 3: waiting and ask for explicit go/ok/procedi or
    equivalent approval before loading $internal-gateway-writing-plans;
    otherwise route to the recommended specialized owner and stop. After plan creation,
    emit Handoff Gate 4: plan-created with Continuation: waiting and stop
    before execution.
name: internal-gateway-idea-brainstorming
description: Use when a repository-owned request starts with a vague idea, unclear goal, unresolved option set, or needs substantive definition, convergence, or validated handoff before operational planning or simple execution.
