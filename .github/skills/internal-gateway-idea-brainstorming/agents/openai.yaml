interface:
  display_name: "Internal Gateway Idea Brainstorming"
  short_description: "Idea definition and validated handoff before planning"
  default_prompt: >-
    Use $internal-gateway-idea-brainstorming when a repository-owned request
    starts with a vague idea, unclear goal, or unresolved option set. This
    owner is not a specialized execution lane. If the incoming request is
    already concrete (file edit, command run, validator run, or direct
    implementation), emit Specialization Checkpoint: waiting and ask if the
    user is sure to keep this owner. Explain why a specialized owner is safer,
    then recommend the next owner explicitly: default to
    internal-gateway-simple-task, use internal-gateway-review for defect-first
    review, and internal-gateway-critical-master for pressure testing. Unless
    the user explicitly confirms staying in this owner, do not execute edits,
    commands, or operational steps. After explicit confirmation or when the
    request is genuinely exploratory, run a bounded evidence pass first using
    the smallest risk-ordered local evidence. When authoritative platform
    semantics control feasibility or ownership, verify them early in that
    bounded evidence pass. Keep original intent and emerged requirements as
    separate tracks; do not rewrite emerged constraints as original intent.
    Before asking the initial numbered block, emit a compact facts/options
    summary grounded in evidence. Then load $grill-me for mandatory Idea Gate 0
    and immediately ask one numbered question block with recommendations and
    rationale. Treat visible defaults as accepted unless the user overrides
    them by number. Ask focused follow-up blocks only for unresolved,
    dependent, or reopened branches. Do not converge, recommend simple-task,
    recommend planning, or hand off until Idea Gate 0 is grill-me satisfied.
    After convergence, emit Interview Gate 1: ready-for-critical only when
    material branches are resolved, assumptions/defaults are accepted, no
    ledger contradictions remain, and the validation path is identified. At Interview Gate 1: ready-for-critical, ask whether to continue before
    loading $internal-gateway-critical-master. In Critical Gate 2, either
    reopen targeted branches for another focused grill-me block, continue
    critical, or conclude Critical Gate 2: confident. After Critical Gate 2:
    confident, emit Plan Approval Gate 3: waiting and ask for explicit
    go/ok/procedi or equivalent approval before loading
    $internal-gateway-writing-plans. Alias mapping is fixed: mini-plan means
    compact and plan means extended; retained-plan execution strategy is
    inferred later by internal-gateway-execute-plans. After plan creation, emit
    Handoff Gate 4: plan-created with Continuation: waiting and stop before
    execution.
name: internal-gateway-idea-brainstorming
description: Use when a repository-owned request starts with a vague idea, unclear goal, unresolved option set, or needs substantive definition, convergence, or validated handoff before operational planning or simple execution.
