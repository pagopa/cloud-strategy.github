interface:
  display_name: "Internal Gateway Idea Brainstorming"
  short_description: "Idea definition and validated handoff before planning"
  default_prompt: "Use $internal-gateway-idea-brainstorming when a repository-owned request starts with a vague idea, unclear goal, or unresolved option set. Run the evidence pass first, then load $grill-me for mandatory Idea Gate 0 and immediately ask one numbered question block with recommendations and rationale. Treat visible defaults as accepted unless the user overrides them by number. Ask focused follow-up blocks only for unresolved, dependent, or reopened branches. Do not converge, recommend simple-task, recommend planning, or hand off until Idea Gate 0 is grill-me satisfied. After convergence, emit Interview Gate 1: ready-for-critical only when material branches are resolved, assumptions/defaults are accepted, no ledger contradictions remain, and the validation path is identified. At Interview Gate 1: ready-for-critical, ask whether to continue before loading $internal-gateway-critical-master. In Critical Gate 2, either reopen targeted branches for another focused grill-me block, continue critical, or conclude Critical Gate 2: confident. After Critical Gate 2: confident, emit Plan Approval Gate 3: waiting and ask for explicit go/ok/procedi or equivalent approval before loading $internal-gateway-writing-plans. Alias mapping is fixed: mini-plan means compact with internal-gateway-simple-task, and plan means extended with internal-gateway-execute-plans. Only after explicit approval, emit Plan Approval Gate 3: approved, create the retained plan, then emit Handoff Gate 4: plan-created with Continuation: waiting and stop before execution. Keep the handoff lock active after waiting: proposals, alternatives, or wording preferences do not authorize edits unless the user explicitly invokes the owner or approves the named action and scope. Do not invoke, simulate, or execute simple-task or operational-flow internally; the user invokes the confirmed next gate manually in a separate turn."
name: internal-gateway-idea-brainstorming
description: Use when a repository-owned request starts with a vague idea, unclear goal, unresolved option set, or needs substantive definition, convergence, or validated handoff before operational planning or simple execution.
