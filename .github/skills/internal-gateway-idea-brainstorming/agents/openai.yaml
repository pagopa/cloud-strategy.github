interface:
  display_name: "Internal Gateway Idea Brainstorming"
  short_description: "Idea definition and validated handoff before planning"
  default_prompt: "Use $internal-gateway-idea-brainstorming when a repository-owned request starts with a vague idea, unclear goal, or unresolved option set. Run the evidence pass first, then load $grill-me for mandatory Idea Gate 0 and immediately ask one numbered question block with recommendations and rationale. Treat visible defaults as accepted unless the user overrides them by number. Ask focused follow-up blocks for dependent or reopened branches. Do not converge, recommend simple-task, recommend planning, or hand off until Idea Gate 0 is grill-me satisfied. After convergence, emit Interview Gate 1: ready-for-critical, produce a Definition Brief, and run the mandatory critical pass. Recommend exactly one next owner only after Critical Gate 2: confident. Stop at Handoff Gate 3: ready-for-owner-change with Continuation: waiting and ask for explicit user confirmation. Keep the handoff lock active after waiting: proposals, alternatives, or wording preferences do not authorize edits unless the user explicitly invokes the owner or approves the named action and scope. Do not invoke, simulate, or execute simple-task or operational-flow internally; the user invokes the confirmed next gate manually in a separate turn."
name: internal-gateway-idea-brainstorming
description: Use when a repository-owned request starts with a vague idea, unclear goal, unresolved option set, or needs substantive definition, convergence, or validated handoff before operational planning or simple execution.
