name: 🛂 terraform-pre-commit

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: terraform-pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-pre-commit:
    name: terraform-pre-commit
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TF_INPUT: "0"
      TF_CLI_ARGS_init: "-backend=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7 https://github.com/actions/checkout/releases/tag/v4.1.7

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0 https://github.com/actions/setup-python/releases/tag/v5.1.0
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0 https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.0
        with:
          terraform_wrapper: false

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Show tool versions
        run: |
          python --version
          pre-commit --version
          terraform version

      - name: Run terraform_fmt with pre-commit (verbose)
        run: |
          pre-commit run terraform_fmt \
            --all-files \
            --config .pre-commit-config.yaml \
            --verbose \
            --show-diff-on-failure \
            --color always

      - name: Run terraform_validate with pre-commit (verbose)
        run: |
          pre-commit run terraform_validate \
            --all-files \
            --config .pre-commit-config.yaml \
            --verbose \
            --show-diff-on-failure \
            --color always
