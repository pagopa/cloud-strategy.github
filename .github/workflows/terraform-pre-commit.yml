name: terraform-pre-commit

on:
  pull_request:
    paths:
      - '**/*.tf'
      - .pre-commit-config.yaml
      - .github/workflows/terraform-pre-commit.yml
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - .pre-commit-config.yaml
      - .github/workflows/terraform-pre-commit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has-terraform: ${{ steps.detect.outputs.has_terraform }}
    steps:
      - name: Check out repository
        # actions/checkout@v6.0.2
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Detect Terraform files
        id: detect
        run: |
          set -euo pipefail
          if find . -name '*.tf' -print -quit | grep -q .; then
            echo 'has_terraform=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_terraform=false' >> "$GITHUB_OUTPUT"
          fi

  pre-commit:
    needs: detect-terraform
    if: ${{ needs.detect-terraform.outputs.has-terraform == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRE_COMMIT_IMAGE: ghcr.io/antonbabenko/pre-commit-terraform:v1.105.0@sha256:4ef4b8323b27fc263535ad88c9d2f20488fcb3b520258e5e7f0553ed5f6692b5
      PRE_COMMIT_CONFIG: .pre-commit-config.yaml
      TF_INPUT: "0"
      TF_IN_AUTOMATION: "1"
    steps:
      - name: Check out repository
        # actions/checkout@v6.0.2
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Pull pre-commit container image
        run: |
          set -euo pipefail
          docker pull "$PRE_COMMIT_IMAGE"

      - name: Run terraform pre-commit hooks in container
        run: |
          set -euo pipefail
          docker run --rm \
            -e USERID="$(id -u):$(id -g)" \
            -e TF_INPUT \
            -e TF_IN_AUTOMATION \
            -v "$PWD:/lint" \
            -w /lint \
            "$PRE_COMMIT_IMAGE" run \
            --all-files \
            --config "$PRE_COMMIT_CONFIG" \
            --verbose \
            --show-diff-on-failure \
            --color always
