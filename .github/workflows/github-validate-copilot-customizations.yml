name: Validate Copilot Customizations

on:
  pull_request:
    paths:
      - ".github/**"
      - "agents/**"
      - "instructions/**"
      - "prompts/**"
      - "skills/**"
      - "scripts/**"
      - "templates/**"
      - "workflows/**"
      - "copilot-*.md"
      - "AGENTS.md"
      - "PULL_REQUEST_TEMPLATE.md"
      - "pull_request_template.md"
      - "repo-profiles.yml"
      - "security-baseline.md"
      - "DEPRECATION.md"
      - ".bootstrap-ignore"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "agents/**"
      - "instructions/**"
      - "prompts/**"
      - "skills/**"
      - "scripts/**"
      - "templates/**"
      - "workflows/**"
      - "copilot-*.md"
      - "AGENTS.md"
      - "PULL_REQUEST_TEMPLATE.md"
      - "pull_request_template.md"
      - "repo-profiles.yml"
      - "security-baseline.md"
      - "DEPRECATION.md"
      - ".bootstrap-ignore"

permissions:
  contents: read

concurrency:
  group: validate-copilot-customizations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Files
    runs-on: ubuntu-24.04 # latest stable GitHub-hosted Ubuntu runner
    timeout-minutes: 10
    env:
      PYTHON_VERSION: "3.14.3" # Python v3.14.3
      PIP_VERSION: "26.0.1" # pip v26.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 https://github.com/actions/setup-python/releases/tag/v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Detect config root
        id: config-root
        run: |
          if [[ -d ".github/scripts" ]]; then
            echo "root=.github" >> "$GITHUB_OUTPUT"
          else
            echo "root=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install TechAI Python test dependencies
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -r .github/tech-ai-requirements-dev.txt

      - name: Lint validator script
        run: |
          bash -n "${{ steps.config-root.outputs.root }}/scripts/"*.sh
          shellcheck -s bash "${{ steps.config-root.outputs.root }}/scripts/"*.sh

      - name: Validate copilot customizations
        run: "${{ steps.config-root.outputs.root }}/scripts/validate-copilot-customizations.sh" --scope root --mode strict

      - name: Run TechAI Python checks
        run: |
          python -m compileall .github/scripts tests
          python -m pytest -q
