name: 20 🕵️‍♀️ _github-catalog-validation

on:
  pull_request:
    paths:
      - .github/**
      - tests/**
      - Makefile
      - .python-version
      - AGENTS.md
      - CONTRIBUTING.md
      - INTERNAL_CONTRACT.md
      - LESSONS_LEARNED.md
      - VERSION
  push:
    branches:
      - main
    paths:
      - .github/**
      - tests/**
      - Makefile
      - .python-version
      - AGENTS.md
      - CONTRIBUTING.md
      - INTERNAL_CONTRACT.md
      - LESSONS_LEARNED.md
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: _github-catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # actions/checkout@v6.0.2
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python@v6.0.0
        # https://github.com/actions/setup-python/releases/tag/v6.0.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"

      - name: Run repository validation targets
        run: |
          set -euo pipefail
          bash ./.github/scripts/github_catalog_validation.sh --skip-token-risks

      - name: Run dedicated token-risk scan
        continue-on-error: true
        run: |
          set -euo pipefail
          bash ./.github/scripts/github_catalog_validation.sh --token-risks-only
